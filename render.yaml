# Render 一键部署：https://render.com → New → Blueprint
services:
  - type: web
    name: firemind
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install flask>=3.0 gunicorn>=22.0 && pip install -r requirements.txt
    startCommand: python -m gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHONPATH
        value: .
      - key: OPENAI_API_KEY
        sync: false
      - key: FIREMIND_OCR_API_KEY
        sync: false
      - key: FIREMIND_OCR_API_BASE
        value: https://api.deepseek.com/v1
      - key: FIREMIND_OCR_MODEL
        value: deepseek-v4-flash-vision-exp
